[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "protocolpulse-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<0.116", "uvicorn>=0.30,<1", "pydantic>=2.13,<3",
  "pydantic-settings>=2,<3", "SQLAlchemy>=2.0,<2.1", "alembic>=1.14,<2",
  "python-multipart>=0.0.20", "PyMuPDF==1.27.2.3", "tzdata>=2025.2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.9,<1"]

[tool.setuptools]
packages = ["backend.app", "backend.app.api", "backend.app.core", "backend.app.db",
            "backend.app.integrations", "backend.app.models", "backend.app.schemas", "backend.app.services"]
package-dir = {"backend.app" = "app"}

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["F403", "F405"]
