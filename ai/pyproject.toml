[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "protocolpulse-ai"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.13,<3", "google-genai==3.3.0"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.setuptools]
packages = ["ai", "ai.agents", "ai.tools", "ai.prompts", "ai.providers", "ai.evals"]
package-dir = {"ai" = "."}
